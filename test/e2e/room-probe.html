<!doctype html>
<html><head><meta charset="UTF-8"><title>e2e room probe</title></head>
<body>
<!-- 시나리오 검사(e2e-room.test.js)가 띄우는 페이지. **앱이 쓰는 것과 같은 접속 코드**를 부른다.
     화면은 없고, 일어난 일을 window.E2E 에 적어 둔다 -->
<script type="module">
import { connectAndWait, pickTeam, startRoom, kickPlayer, onRoom, onGo, onKicked,
         backToLobby, setRoomMode, getConnection } from '/src/net/connection.js';
import { SELF } from '/src/game/config.js';
import { t } from '/src/i18n/index.js';
const E = window.E2E = { stage: [], entered: null, code: null, room: null, go: false,
                         kicked: false, err: null, errCode: null, noEntry: t('room.noEntry') };
onRoom(r => { E.room = r; });
onGo(() => { E.go = true; });
onKicked(() => { E.kicked = true; });
window.act = { pickTeam, startRoom, kickPlayer, backToLobby, setRoomMode,
  // 검사 전용: 판을 바로 끝낸다 (E2E_DEBUG 서버에서만 먹는다)
  endNow: () => { const c = getConnection(); c && c.transport.clientSend({ t: '__end' }); },
  // 검사용: 게임 화면에 들어와 입력을 보내는 상태를 흉내 낸다 (서버의 `seen` 표시가 켜진다)
  seenNow: () => { const c = getConnection(); if (!c) return;
    c.transport.clientSend({ t: 'in', tick: 999999, ready: 1, go: 1 }); } };
window.SELF = SELF;
window.start = (mode, code, n) => {
  connectAndWait({ mode, code, n,
    onStage: s => E.stage.push(s),
    onCode: c => { E.code = c; E.entered = 'code'; },
    onJoined: () => { E.entered = 'joined'; } })
    .then(() => { E.resolved = true; })
    .catch(e => { E.err = (e && e.message) || 'err'; E.errCode = (e && e.code) || null; });
};
window.READY = true;
</script>
</body></html>
